name: publish

# Publishes to PyPI with Trusted Publishing (no API tokens) when a GitHub release is published.
# The release tag must be "v" + the version in pyproject.toml, e.g. v0.1.0. GitHub pre-releases
# must use a PEP 440 pre-release version, e.g. v0.2.0rc1.
#
# Two jobs: `build` runs all checks and builds with no publishing rights; `publish` holds the
# PyPI identity token and only uploads the already-built files.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false  # a release build never reuses caches written by other runs
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
          if [ "$PRERELEASE" = "true" ] && ! echo "$version" | grep -Eq '(a|b|rc)[0-9]+$'; then
            echo "GitHub pre-release needs a pre-release version (e.g. 0.2.0rc1), got $version"; exit 1
          fi
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opgraph/
    permissions:
      id-token: write  # lets PyPI verify this workflow; no stored secrets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true  # a re-run after a partial upload does not fail
