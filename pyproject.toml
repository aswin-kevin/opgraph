[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opgraph"
version = "0.1.0"
description = "Typed actions, shared memory, enforced scope and owned cleanup for agentic pentest systems."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aswin" }]
keywords = ["security", "pentest", "agents", "llm", "mcp", "offensive-security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]
dependencies = []  # the core is stdlib-only; keep it that way

[project.urls]
Homepage = "https://github.com/aswin-kevin/opgraph"
Repository = "https://github.com/aswin-kevin/opgraph"
Issues = "https://github.com/aswin-kevin/opgraph/issues"

[project.optional-dependencies]
# Only official packages from the framework vendors.
mcp = ["mcp>=2.3"]
openai-agents = ["openai-agents>=0.24"]

[project.scripts]
opgraph-mcp = "opgraph.adapters.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "mcp>=2.3", "openai-agents>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/opgraph"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: only these ever ship, whatever else sits in the working tree.
only-include = ["src/opgraph", "tests", "examples", "LICENSE", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not kali and not live'"
markers = [
  "kali: needs ssh access to the Kali lab box",
  "live: calls a real LLM (needs OLLAMA_API_KEY)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
pythonVersion = "3.11"
